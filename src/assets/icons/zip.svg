<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16">
  <!-- 文档底：紫色，与 doc/xls/ppt/pdf 同家族 -->
  <path fill="#9b6dd6" d="M5 2h10l4 4v16H5z"/>
  <path fill="rgba(255,255,255,.35)" d="M15 2l4 4h-4z"/>
  <!-- 简洁拉链：居中竖轨 + 滑块 + 顶部拉环 -->
  <g fill="#fff" opacity=".92">
    <!-- 顶部拉环 -->
    <rect x="10.8" y="5.2" width="2.4" height="1.3" rx=".65" transform="rotate(-15,12,5.85)"/>
    <!-- 竖向轨道 -->
    <rect x="11.3" y="7" width="1.4" height="12" rx=".7"/>
    <!-- 中部滑块（闭合块，视觉焦点） -->
    <rect x="9.4" y="11" width="5.2" height="3.2" rx="1.2"/>
    <!-- 滑块上的小横纹（增加质感） -->
    <line x1="11" y1="12.6" x2="13" y2="12.6" stroke="#9b6dd6" stroke-width=".8" stroke-linecap="round"/>
  </g>
</svg>
