# 创建人: DD1024z + Composer; 创建时间: 2026-09-18
# 修改人: DD1024z + Hy3; 修改时间: 2026-09-24 — 新增 tabby_frontend / installed_plugins 两个可选字段，
#   供插件「意见反馈」入口经 URL query 参数（按字段 id）自动预填
name: 缺陷报告
description: 报告 Bug（请尽量填全环境与复现步骤）
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供完整信息，方便快速定位问题。

  - type: input
    id: os_version
    attributes:
      label: 系统版本信息
      description: 例如 Windows 11 24H2 / macOS 15.1 / Ubuntu 24.04
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: tabby_version
    attributes:
      label: Tabby 版本信息
      description: 可在 Tabby → About / 关于 中查看
      placeholder: 1.0.2xx
    validations:
      required: true

  - type: input
    id: sftp_plus_version
    attributes:
      label: SFTP+ 插件版本信息
      description: 可在插件列表或 package.json / 发布页查看已安装版本
      placeholder: 0.x.x
    validations:
      required: true

  # 以下两项由插件「意见反馈」入口自动预填（URL query 参数按字段 id 注入）
  - type: input
    id: tabby_frontend
    attributes:
      label: Tabby 前端
      description: 设置 → 外观 → 前端（如 xterm-webgl / xterm.js / vte）
      placeholder: xterm-webgl
    validations:
      required: false

  - type: input
    id: installed_plugins
    attributes:
      label: 已安装插件
      description: 插件列表，便于判断插件间冲突
      placeholder: tabby-sftp-plus@2.3.1, tabby-quick-command-plus@1.0.0
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 你做了哪些操作后出现问题？
      placeholder: |
        1. 打开……
        2. 点击……
        3. 输入……
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际现象
      description: 现在发生了什么？（可贴报错文案、截图说明）
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 按理说应该怎样才对？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志（可选）
      description: 粘贴日志即可，会自动按代码块展示
      render: shell
    validations:
      required: false
