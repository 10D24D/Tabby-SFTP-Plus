# 创建人: DD1024z + Composer; 创建时间: 2026-09-18
# 修改人: DD1024z + Composer; 修改时间: 2026-09-18
name: 功能需求
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！请尽量说明使用场景与期望行为。

  - type: input
    id: os_version
    attributes:
      label: 系统版本信息
      description: 例如 Windows 11 24H2 / macOS 15.1 / Ubuntu 24.04
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: tabby_version
    attributes:
      label: Tabby 版本信息
      description: 可在 Tabby → About / 关于 中查看
      placeholder: 1.0.2xx
    validations:
      required: true

  - type: input
    id: sftp_plus_version
    attributes:
      label: SFTP+ 插件版本信息
      description: 可在插件列表或 package.json / 发布页查看已安装版本
      placeholder: 0.x.x
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 当前痛点或使用场景是什么？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能 / 行为
      description: 希望产品怎么做？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案（可选）
      description: 目前有没有临时绕过办法，或其他产品里类似的做法？
    validations:
      required: false
