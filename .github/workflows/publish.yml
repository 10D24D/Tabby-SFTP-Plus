# GitHub Actions → npm 自动发布
# 触发条件：创建 GitHub Release 时自动发布到 npm
# 使用 npm Trusted Publisher（OIDC），无需 Token，绕过 2FA
#
# 发布流程：
#   1. git push && git push --tags
#   2. 在 GitHub 仓库页面创建 Release（关联已有 tag）
#   3. Release published 事件触发本 workflow，自动发布到 npm
#
# 注意：仅通过 release 事件触发，避免 push tag + create Release 导致重复执行。
name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC 认证需要

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check whether version already exists
        id: version
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.exists != 'true'
        run: npm run build

      - name: Publish
        if: steps.version.outputs.exists != 'true'
        run: npm publish --access public --provenance
